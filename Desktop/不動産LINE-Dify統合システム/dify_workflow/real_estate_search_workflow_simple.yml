app:
  description: 不動産賃貸物件検索システム
  icon: 🏢
  icon_background: '#4A90E2'
  mode: workflow
  name: 不動産LINE検索システム
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: llm
        id: start-to-llm
        source: '1'
        sourceHandle: source
        target: answer_generator
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: llm-to-answer
        source: answer_generator
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ユーザーからの質問を受け取る
          selected: false
          title: 開始
          type: start
          variables:
            - label: ユーザー質問
              max_length: 1000
              required: true
              type: text-input
              variable: query
        height: 90
        id: '1'
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
          desc: 質問に回答
          model:
            completion_params:
              frequency_penalty: 0
              max_tokens: 2000
              presence_penalty: 0
              temperature: 0.7
              top_p: 1
            mode: chat
            name: gpt-4
            provider: openai
          prompt_template:
            - role: system
              text: |
                あなたは賃貸物件検索AIアシスタントです。
                ユーザーの質問に丁寧に回答してください。
            - role: user
              text: '{{#1.query#}}'
          selected: false
          title: 回答生成
          type: llm
          vision:
            enabled: false
        height: 90
        id: answer_generator
        position:
          x: 400
          y: 282
        positionAbsolute:
          x: 400
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#answer_generator.text#}}'
          desc: ''
          selected: false
          title: 直接返信
          type: answer
          variables: []
        height: 90
        id: answer
        position:
          x: 720
          y: 282
        positionAbsolute:
          x: 720
          y: 282
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
